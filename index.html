const lessonGuides=[{"concept":"Music uses seven letter names: A, B, C, D, E, F, G. They repeat at higher and lower octaves. A sharp raises a note by one semitone; a flat lowers it by one semitone. On piano, adjacent keys are one semitone apart; on guitar, adjacent frets are one semitone apart.","example":"Find C, C♯, D and E on a piano, then play the same four pitches on the guitar's B string at frets 1, 2, 3 and 5.","steps":["Locate middle C on the keyboard.","Move one key to the right: C♯ (also called D♭).","Move one more key to D; notice that E is two semitones above D.","On the guitar B string, fret 1 is C; each higher fret raises the pitch one semitone."],"question":"How many semitones separate C and D?","options":["1","2","3"],"answer":1,"why":"C → C♯ → D is two semitone steps."},{"concept":"Written music uses a staff of five lines. In treble clef, the lines from bottom to top are E G B D F; spaces are F A C E. In bass clef, lines are G B D F A and spaces A C E G. A quarter note lasts one beat in 4/4 time; a half note lasts two; a whole note lasts four.","example":"A 4/4 measure can contain four quarter notes, two half notes, or one whole note.","steps":["Read the time signature: the upper 4 means four quarter-note beats per measure.","Count a quarter note as one beat.","Count a half note as two beats.","Fill one measure with durations adding to four beats."],"question":"How many quarter-note beats does a half note last?","options":["1","2","4"],"answer":1,"why":"A half note equals two quarter notes."},{"concept":"A scale is an ordered collection of pitches. The major scale uses whole and half steps in the pattern W–W–H–W–W–W–H. A whole step equals two semitones, and a half step equals one. Note spelling matters: every letter name appears once in a seven-note diatonic scale.","example":"F major is F–G–A–B♭–C–D–E–F. Its key signature contains one flat: B♭.","steps":["Start at F.","Move a whole step to G, then a whole step to A.","Move a half step to B♭, not A♯: the next scale degree must use the letter B.","Continue W–W–W–H to C, D, E and F."],"question":"Which note is the fourth degree of F major?","options":["A♯","B♭","B"],"answer":1,"why":"The fourth letter from F is B, and the key signature lowers it to B♭."},{"concept":"A triad is built by stacking thirds: root, third and fifth. Major triads use semitone offsets 0–4–7; minor triads use 0–3–7; diminished triads use 0–3–6; augmented triads use 0–4–8. A seventh chord adds a seventh above the root. Inversions change which chord tone is lowest without changing the chord's identity.","example":"F major is F–A–C. First inversion is A–C–F, and second inversion is C–F–A.","steps":["Build F major by taking the first, third and fifth degrees of the F major scale.","Put F at the bottom for root position.","Move F above A and C to make first inversion.","Move A above C and F to make second inversion."],"question":"Which notes form F major in first inversion?","options":["F–A–C","A–C–F","C–F–A"],"answer":1,"why":"First inversion puts the third (A) in the bass."},{"concept":"Harmony describes how notes and chords work together. In a major key, diatonic triads follow I major, ii minor, iii minor, IV major, V major, vi minor, vii° diminished. Roman numerals describe a chord's function relative to its key.","example":"In C major, I–IV–V–I is C major → F major → G major → C major.","steps":["Write the C major scale: C D E F G A B.","Build a triad from scale degrees 1, 4 and 5.","Play C–E–G, then F–A–C, then G–B–D.","Return to C–E–G and listen for resolution."],"question":"In C major, what is the IV chord?","options":["D minor","F major","G major"],"answer":1,"why":"The fourth scale degree is F, giving F–A–C."},{"concept":"Transposition moves a musical idea to a new pitch level while preserving interval relationships. Ear training develops recognition of pitch movement and chord quality. Improvisation uses these same relationships in real time.","example":"Transpose the C major triad C–E–G up a perfect fourth to F–A–C.","steps":["Identify the original chord tones C, E and G.","Move each tone up a perfect fourth: C→F, E→A, G→C.","Check that the major-third and perfect-fifth relationships remain unchanged.","Play both chords on your instrument and compare the sound."],"question":"Transposing C major up a perfect fourth produces which chord?","options":["F major","G major","A minor"],"answer":0,"why":"C moves to F, and the major triad becomes F–A–C."}];

function signatureAccidentals(sig){

function spellingFor(pitch,letter){

}
function notationData(){

const keySig=scale==='Minor'?keyInfo[chromatic[(rootPitch+3)%12]].sig:keyInfo[root].sig;

const offsets=spec?spec.intervals:patterns[scale];
const degrees=spec?spec.degrees:scale==='Pentatonic'?[0,1,2,4,5]:[0,1,2,3,4,5,6];
const start=noteLetters.indexOf(tonic[0]);
let spelling=offsets.map((offset,i)=>spellingFor((rootPitch+offset)%12,noteLetters[(start+degrees[i])%7]));
const count=spelling.length;
if(notationMode==='Chord'){
const shift=inversion%count;
spelling=spelling.slice(shift).concat(spelling.slice(0,shift));
}
const signature=notationMode==='Chord'?keyInfo[root].sig:keySig;
const sigMap=signatureAccidentals(signature);
const noteData=spelling.map(n=>({...n,label:n.letter+n.accidental,explicit:n.accidental!== (sigMap[n.letter]||'')}));

function staffSVG(){

const baseX=140+Math.abs(sig)*21;
const displayNotes=notationMode==='Chord'?voicingNotes():data.spelling;
const noteSvg=displayNotes.map((n,i)=>{
const idx=noteLetters.indexOf(n.letter);
if(i===0){octave=bass?(notationMode==='Chord'?2:3):4;}
else if(idx<=prev)octave++;
prev=idx;
if(notationMode==='Chord')octave=n.octave;

let ledger='';
for(let yy=130;yy<=y+1;yy+=14)ledger+='<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="'+yy+'" y2="'+yy+'" stroke="#1a222c"/>';

const accidental=n.explicit?'<text x="'+(x-(notationMode==='Chord'?34:23))+'" y="'+(y+7)+'" font-family="serif" font-size="23" fill="#1a222c">'+(n.accidental||'♮')+'</text>':'';
return ledger+accidental+'<ellipse cx="'+x+'" cy="'+y+'" rx="9" ry="6" transform="rotate(-20 '+x+' '+y+')" fill="#455b75"/>'+(notationMode==='Scale'?'<line x1="'+(x+8)+'" y1="'+y+'" x2="'+(x+8)+'" y2="'+(y-34)+'" stroke="#455b75" stroke-width="1.5"/>':'')+(notationMode==='Scale'?'<text x="'+x+'" y="180" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="12" fill="#455b75">'+n.label+'</text>':'');
}).join('');

function guitarDiagram(key,s){

return Array.from({length:7},(_,i)=>{let l=letters[(begin+i)%7];return l+(map[l]||'')});
}

return '<g role="button" tabindex="0" aria-label="'+k.name+' major, '+k.minor+' relative minor" onclick="setCircle(circleKeys['+i+'].name)" onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();setCircle(circleKeys['+i+'].name)}" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="28" fill="'+(active?'#455b75':'#e9eff5')+'" stroke="'+(active?'#455b75':'#cbd5e1')+'" stroke-width="1.5"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="16" font-weight="700" fill="'+(active?'white':'#1a222c')+'">'+k.name+'</text><text x="'+mx+'" y="'+(my+5)+'" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="13" fill="'+(active?'#234a77':'#5d6772')+'">'+k.minor+'</text></g>';

function voicingNotes(){
const d=notationData();let octave=pianoOctave,prev=-1;
let a=d.spelling.map(n=>{const idx=noteLetters.indexOf(n.letter);if(prev>=0&&idx<=prev)octave++;prev=idx;return {...n,octave};});
if(voicing==='Open'&&a.length>2)a[1].octave++;
if(voicing==='Spread'&&a.length>2){a[1].octave++;a[a.length-1].octave++}
return a.sort((x,y)=>(x.octave*7+noteLetters.indexOf(x.letter))-(y.octave*7+noteLetters.indexOf(y.letter)));
}
function instrumentChordHTML(){
if(notationMode!=='Chord')return '';

}

instrumentPaths.Piano.push(...[["Posture and touch","Relaxed movement and controlled sound","Sit centered at the keyboard with feet supported and elbows near key height. Keep shoulders relaxed, wrists neutral and fingers naturally curved. Sound comes from controlled movement, not squeezing or forcing the keys.","Play middle C softly four times, then four times at a medium volume without stiffening your wrist.",["Adjust your seat so your forearms are roughly level with the keys.","Rest your right hand on C–G.","Play C with a relaxed thumb, releasing between notes.","Repeat on D with finger 2 and compare the sound."],"What should you avoid when playing? ",["Relaxed shoulders","A rigid, raised wrist","Naturally curved fingers"],1,"A rigid wrist makes movement harder. Stop if you experience pain.","Practice"],["Treble-clef sight-reading","Read intervals and landmark notes","Use middle C, treble G on the second line, and other familiar notes as landmarks. Read whether the next note moves up, down or repeats instead of counting every line from scratch.","Starting on middle C, play C D E G E D C; notice the stepwise movement and the skip from E to G.",["Locate middle C and treble G.","Play C D E using fingers 1 2 3.","Skip to G with finger 5.","Reverse the phrase slowly while naming each note.","Use the staff explorer to locate unfamiliar notes."],"What pitch is on the second line of treble clef?",["E","G","B"],1,"The treble clef marks G on its second line.","Scales & Chords"],["Bass-clef sight-reading","Left-hand landmarks and intervals","Bass clef represents lower pitches. Its fourth line is F, and middle C lies on a ledger line above the staff. Read intervals from familiar landmarks and transfer them to the keyboard.","Play C3 D3 E3 F3 G3 with left-hand fingers 5 4 3 2 1.",["Find middle C, then the C one octave below it.","Place left pinky on C3 and thumb on G3.","Play the five notes ascending and descending.","Locate the notes using the bass-clef explorer."],"Which pitch is on the fourth line of bass clef?",["F","A","C"],0,"The bass clef marks F on the fourth line.","Scales & Chords"],["Hands together: matching rhythms","Two-hand coordination","Start with each hand separately, then combine them at a slower tempo. Both hands can play the same rhythm even when their finger numbers differ.","Play C D E F G in two octaves, right fingers 1–5 and left fingers 5–1.",["Practice each hand alone until comfortable.","Place left hand on C3–G3 and right hand on C4–G4.","Play matching notes simultaneously, one per beat.","Reverse the pattern without stopping.","Repeat slowly until both notes begin together."],"When combining hands, what should you do first?",["Increase speed","Learn each hand separately","Hold the sustain pedal"],1,"Separate practice reduces coordination demands.","Practice"],["Hands together: independent rhythms","Melody with held bass notes","The hands can play different rhythms at the same time. A steady pulse lets you coordinate a moving melody with a sustained accompaniment.","Hold C3 in the left hand for four beats while the right hand plays C4 D4 E4 G4 as quarter notes.",["Count four beats and hold left-hand C3 throughout.","Practice the right-hand melody separately.","Combine both hands slowly, keeping the left note held.","Release both hands after beat four.","Repeat with a held G3 and a right-hand G F E D phrase."],"How many times should the left hand strike C in the first exercise?",["Four","Two","Once"],2,"One whole note is held for all four beats in 4/4.","Practice"],["One-octave C major scale","Thumb crossings and fingering","A full octave requires changing hand position smoothly. Standard ascending C major fingering is right 1 2 3 1 2 3 4 5 and left 5 4 3 2 1 3 2 1. Reverse these patterns descending.","Right hand plays C D E F G A B C, passing the thumb under after E.",["Practice C D E with right fingers 1 2 3.","Move the thumb under to F without twisting the wrist.","Finish G A B C with fingers 2 3 4 5.","Practice the left hand separately, crossing finger 3 over after G.","Reverse each fingering slowly."],"Which right-hand finger plays F in an ascending C major scale?",["4","1","3"],1,"The thumb crosses under after E to play F.","Scales & Chords"],["G and F major scales","Black keys and scale fingering","Apply the major scale pattern to new keys. G major contains F♯; F major contains B♭. The right-hand G scale uses the C major fingering, while F major uses 1 2 3 4 1 2 3 4 ascending.","Play G A B C D E F♯ G, then F G A B♭ C D E F.",["Find G and identify F♯.","Play the G scale with right-hand C-scale fingering.","Find F and identify B♭.","Play F major using right-hand fingers 1 2 3 4 1 2 3 4.","Reverse each pattern and keep the wrist relaxed."],"Which black key belongs to F major?",["F♯","B♭","C♯"],1,"F major has one flat: B♭.","Scales & Chords"],["A natural minor scale","Minor sound and familiar fingering","A natural minor uses A B C D E F G A. It shares the white-key collection of C major but starts and resolves on A. Practice the same one-octave fingering pattern as C major.","Play A B C D E F G A with right fingers 1 2 3 1 2 3 4 5.",["Locate A below middle C or in a comfortable octave.","Play A B C using fingers 1 2 3.","Cross the thumb to D and finish the octave.","Reverse the fingering descending.","Compare the sound with C major."],"Which note is the third of A natural minor?",["C","C♯","D"],0,"A to C is a minor third.","Scales & Chords"],["Chord progressions and voice leading","Smooth changes using inversions","Voice leading means moving individual notes smoothly between chords. Inversions let you keep shared notes and reduce large hand jumps. The bass note can be supplied separately by the left hand.","Play C–E–G, C–F–A, B–D–G, C–E–G for C–F–G–C.",["Play the C major triad in the right hand.","Keep C and move E to F and G to A.","Move to B D G for G major.","Return to C E G.","Add left-hand roots C F G C, one per measure."],"Why use inversions when changing chords?",["To change every chord into minor","To reduce unnecessary hand movement","To eliminate the bass note"],1,"Inversions can keep chord tones close together.","Scales & Chords"],["Broken chords and accompaniment","Arpeggios and left-hand patterns","A broken chord sounds chord tones one after another instead of simultaneously. A simple accompaniment uses root, fifth and third in a repeating pattern while the right hand plays a melody.","With left hand play C3 G3 E3 G3, one note per beat.",["Find C3 E3 G3 and use a comfortable 5–3–1 hand position.","Play C G E G using 5 1 3 1.","Repeat evenly without stretching beyond comfort.","Practice a right-hand C D E G melody separately.","Combine the patterns slowly."],"What is a broken chord?",["A chord with missing keys","Chord tones played one after another","A chord played only with the pedal"],1,"A broken chord separates its tones in time.","Practice"],["Articulation and dynamics","Legato, staccato and volume","Legato connects notes smoothly; staccato separates them with short releases. Dynamics describe loudness: piano (p) means soft and forte (f) means loud. Keep timing steady while changing touch.","Play C D E F G legato, then staccato, then softly and at medium-loud volume.",["Play the five-finger pattern, releasing each note as the next begins.","Repeat with short, light releases for staccato.","Play the same pattern softly without losing notes.","Repeat at a stronger volume without striking harshly."],"What does staccato mean?",["Smoothly connected","Short and detached","Always loud"],1,"Staccato separates notes with shorter sounding durations.","Practice"],["Sustain pedal basics","Clean harmony and pedal changes","The sustain pedal allows notes to ring after keys are released. Holding it across changing harmonies can blur the sound. A basic technique is to play the new chord, release the old pedal, then press it again while holding the new keys.","Play C major, pedal, then change to G major and refresh the pedal.",["Play C major and press the sustain pedal after sounding it.","Release your fingers and listen to the sustained chord.","Play G major, lift the pedal briefly, then press it again while holding G major.","Repeat C–G slowly and listen for unwanted overlap.","If your keyboard has no pedal, practice the chord changes without one."],"Why refresh the pedal when harmony changes?",["To prevent old notes from muddying the new chord","To change the pitch of the keys","To make every note staccato"],0,"Refreshing the pedal clears the previous harmony.","Practice"],["First complete piano study","Combine reading, coordination and expression","Practice a short original phrase in small sections, keeping a steady pulse. Learn notes and fingering first, then add both hands and dynamics.","In 4/4, right hand plays C D E G | G E D C, all quarter notes; left hand holds C3 for the first bar and G3 for the second.",["Practice the right-hand phrase with fingers 1 2 3 5 | 5 3 2 1.","Practice the left-hand whole notes separately.","Combine hands at a slow, steady count.","Repeat four times without stopping; correct mistakes in isolated sections.","Play softly, then try a gentle crescendo toward the middle."],"What is the best first step when learning a new piece?",["Play at full speed","Learn small sections accurately","Add pedal before learning notes"],1,"Small accurate sections make a complete performance easier.","Practice"]]);

if(!ids.length)return html+'<p><strong>No questions in this selection.</strong> '+(practiceMode==='Review'?'Your review queue is clear. Try the full question bank!':'Try a different topic.')+'</p><button onclick="practiceSetMode(\'All\')">All questions</button></div>';
const id=ids[practiceIndex%ids.length],q=practiceBank[id];html+='<div class="practice-question"><span class="pill">'+q[0]+' · Question '+((practiceIndex%ids.length)+1)+' of '+ids.length+'</span><h2>'+q[1]+'</h2><div class="practice-options">'+q[2].map((v,i)=>'<button '+(practiceAnswered?'disabled':'')+' class="'+(practiceAnswered?(i===q[3]?'correct':i===practiceChoice?'incorrect':''):'')+'" onclick="practiceAnswer('+i+')">'+v+'</button>').join('')+'</div>';
if(practiceAnswered)html+='<div class="practice-feedback" role="status"><strong>'+(practiceChoice===q[3]?'Correct!':'Not quite.')+'</strong> '+q[4]+'<p>'+(practiceChoice===q[3]?'Nice work.':'This question has been added to your review queue.')+'</p></div><button class="primary" onclick="practiceNext()">Next question →</button>';
return html+'</div></div><p class="muted">Strong topics count questions answered correctly at least twice with 80% or better lifetime accuracy. Results are per browser and can be reviewed as often as you like.</p>';
}
