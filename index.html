<script>
const pages=['Home','Learn','Instruments','Scales & Chords','Circle of Fifths','Sheet Music','Practice'];
let page='Home', instrument='Piano', root='C', scale='Major', libraryFilter='All';
const chromatic=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const patterns={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Pentatonic:[0,2,4,7,9]};
const lessons=[['Music Fundamentals','Notes, octaves, sharps, flats, and intervals'],['Rhythm & Notation','Note values, rests, measures, and reading music'],['Scales','Major, minor, and pentatonic patterns'],['Chords','Triads, seventh chords, and inversions'],['Harmony','Chord progressions and the circle of fifths'],['Applied Theory','Transposition, ear training, and improvisation']];
const lessonGuides=[{"concept":"Music uses seven letter names: A, B, C, D, E, F, G. They repeat at higher and lower octaves. A sharp raises a note by one semitone; a flat lowers it by one semitone. On piano, adjacent keys are one semitone apart; on guitar, adjacent frets are one semitone apart.","example":"Find C, C♯, D and E on a piano, then play the same four pitches on the guitar's B string at frets 1, 2, 3 and 5.","steps":["Locate middle C on the keyboard.","Move one key to the right: C♯ (also called D♭).","Move one more key to D; notice that E is two semitones above D.","On the guitar B string, fret 1 is C; each higher fret raises the pitch one semitone."],"question":"How many semitones separate C and D?","options":["1","2","3"],"answer":1,"why":"C → C♯ → D is two semitone steps."},{"concept":"Written music uses a staff of five lines. In treble clef, the lines from bottom to top are E G B D F; spaces are F A C E. In bass clef, lines are G B D F A and spaces A C E G. A quarter note lasts one beat in 4/4 time; a half note lasts two; a whole note lasts four.","example":"A 4/4 measure can contain four quarter notes, two half notes, or one whole note.","steps":["Read the time signature: the upper 4 means four quarter-note beats per measure.","Count a quarter note as one beat.","Count a half note as two beats.","Fill one measure with durations adding to four beats."],"question":"How many quarter-note beats does a half note last?","options":["1","2","4"],"answer":1,"why":"A half note equals two quarter notes."},{"concept":"A scale is an ordered collection of pitches. The major scale uses whole and half steps in the pattern W–W–H–W–W–W–H. A whole step equals two semitones, and a half step equals one. Note spelling matters: every letter name appears once in a seven-note diatonic scale.","example":"F major is F–G–A–B♭–C–D–E–F. Its key signature contains one flat: B♭.","steps":["Start at F.","Move a whole step to G, then a whole step to A.","Move a half step to B♭, not A♯: the next scale degree must use the letter B.","Continue W–W–W–H to C, D, E and F."],"question":"Which note is the fourth degree of F major?","options":["A♯","B♭","B"],"answer":1,"why":"The fourth letter from F is B, and the key signature lowers it to B♭."},{"concept":"A triad is built by stacking thirds: root, third and fifth. Major triads use semitone offsets 0–4–7; minor triads use 0–3–7; diminished triads use 0–3–6; augmented triads use 0–4–8. A seventh chord adds a seventh above the root. Inversions change which chord tone is lowest without changing the chord's identity.","example":"F major is F–A–C. First inversion is A–C–F, and second inversion is C–F–A.","steps":["Build F major by taking the first, third and fifth degrees of the F major scale.","Put F at the bottom for root position.","Move F above A and C to make first inversion.","Move A above C and F to make second inversion."],"question":"Which notes form F major in first inversion?","options":["F–A–C","A–C–F","C–F–A"],"answer":1,"why":"First inversion puts the third (A) in the bass."},{"concept":"Harmony describes how notes and chords work together. In a major key, diatonic triads follow I major, ii minor, iii minor, IV major, V major, vi minor, vii° diminished. Roman numerals describe a chord's function relative to its key.","example":"In C major, I–IV–V–I is C major → F major → G major → C major.","steps":["Write the C major scale: C D E F G A B.","Build a triad from scale degrees 1, 4 and 5.","Play C–E–G, then F–A–C, then G–B–D.","Return to C–E–G and listen for resolution."],"question":"In C major, what is the IV chord?","options":["D minor","F major","G major"],"answer":1,"why":"The fourth scale degree is F, giving F–A–C."},{"concept":"Transposition moves a musical idea to a new pitch level while preserving interval relationships. Ear training develops recognition of pitch movement and chord quality. Improvisation uses these same relationships in real time.","example":"Transpose the C major triad C–E–G up a perfect fourth to F–A–C.","steps":["Identify the original chord tones C, E and G.","Move each tone up a perfect fourth: C→F, E→A, G→C.","Check that the major-third and perfect-fifth relationships remain unchanged.","Play both chords on your instrument and compare the sound."],"question":"Transposing C major up a perfect fourth produces which chord?","options":["F major","G major","A minor"],"answer":0,"why":"C moves to F, and the major triad becomes F–A–C."}];
let openLesson=0;

function answerLesson(i,choice){const feedback=document.getElementById('lesson-feedback');const guide=lessonGuides[i];feedback.textContent=(choice===guide.answer?'Correct! ':'Not quite. ')+guide.why;feedback.style.color=choice===guide.answer?'#245e4b':'#9b4e2e';}
function guideHTML(i){const l=lessonGuides[i];return '<div class="panel lesson-guide"><h3>1. Concept</h3><p>'+l.concept+'</p><h3>2. Concrete example</h3><p>'+l.example+'</p><h3>3. Step-by-step breakdown</h3><ol>'+l.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><h3>4. Practice / Test</h3><p><strong>'+l.question+'</strong></p><div class="answer-options">'+l.options.map((v,k)=>'<button onclick="answerLesson('+i+','+k+')">'+v+'</button>').join('')+'</div><p id="lesson-feedback" role="status"></p><button class="primary" onclick="toggleLesson('+i+')">'+(completion().includes(i)?'Mark as not complete':'Mark lesson complete')+'</button></div>'}
const songs=[{title:'Your first song',artist:'Example entry',instrument:'Guitar',format:'Tab / PDF',status:'To learn'}];
const $=s=>document.querySelector(s);
const notes=()=>patterns[scale].map(n=>chromatic[(chromatic.indexOf(root)+n)%12]);
const buttons=(values,current,fn)=>'<div class="tabs">'+values.map(v=>'<button class="'+(v===current?'active':'')+'" onclick="'+fn+'('+JSON.stringify(v).replace(/"/g,'&quot;')+')">'+v+'</button>').join('')+'</div>';
function setPage(p){page=p;render();window.scrollTo(0,0)}
function setInstrument(v){instrument=v;render()}

function piano(){
const white=['C','D','E','F','G','A','B','C','D','E','F','G','A','B'],blackAfter=[0,1,3,4,5,7,8,10,11,12];
const selected=notationMode==='Chord'?qualities[chordQuality].intervals:patterns[scale],rootPitch=chromatic.indexOf(root);
const on=p=>selected.some(d=>(rootPitch+d)%12===p);
return '<div class="keyboard">'+white.map(n=>'<div class="white '+(on(naturalPitch[n])?'on':'')+'">'+n+'</div>').join('')+blackAfter.map(i=>{const n=white[i],pitch=(naturalPitch[n]+1)%12;return '<div title="'+chromatic[pitch]+'" class="black '+(on(pitch)?'black-on':'')+'" style="left:'+((i+1)/14*100)+'%"></div>'}).join('')+'</div><p class="muted">Highlighted keys show the selected '+(notationMode==='Chord'?'chord tones':'scale tones')+'. Voicing octave choices are reflected on the staff above.</p>';
}
function guitar(){
const tuning=['E','B','G','D','A','E'],selected=notationMode==='Chord'?qualities[chordQuality].intervals:patterns[scale],rootPitch=chromatic.indexOf(root);
const on=p=>selected.some(d=>(rootPitch+d)%12===p);
return '<div class="fret"><table><tr><th>String</th>'+Array.from({length:13},(_,f)=>'<th>'+(f+guitarStart)+'</th>').join('')+'</tr>'+tuning.map(n=>'<tr><th>'+n+'</th>'+Array.from({length:13},(_,f)=>{let pitch=(naturalPitch[n]+f+guitarStart)%12;return '<td>'+(on(pitch)?'<span class="note">'+chromatic[pitch]+'</span>':'')+'</td>'}).join('')+'</tr>').join('')+'</table></div><p class="muted">Standard tuning (E A D G B E, low to high). Highlighted pitches belong to the selected '+(notationMode==='Chord'?'chord':'scale')+'. This is a note map, not a recommended fingering.</p>';
}


let notationMode='Scale', chordQuality='Major', inversion=0, clef='Treble';
const keyInfo={
'C':{tonic:'C',sig:0},'C♯':{tonic:'D♭',sig:-5},'D':{tonic:'D',sig:2},'D♯':{tonic:'E♭',sig:-3},'E':{tonic:'E',sig:4},'F':{tonic:'F',sig:-1},'F♯':{tonic:'F♯',sig:6},'G':{tonic:'G',sig:1},'G♯':{tonic:'A♭',sig:-4},'A':{tonic:'A',sig:3},'A♯':{tonic:'B♭',sig:-2},'B':{tonic:'B',sig:5}};
const noteLetters=['C','D','E','F','G','A','B'], naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const qualities={
'Major':{intervals:[0,4,7],degrees:[0,2,4]},'Minor':{intervals:[0,3,7],degrees:[0,2,4]},
'Diminished':{intervals:[0,3,6],degrees:[0,2,4]},'Augmented':{intervals:[0,4,8],degrees:[0,2,4]},
'Major 7':{intervals:[0,4,7,11],degrees:[0,2,4,6]},
'Dominant 7':{intervals:[0,4,7,10],degrees:[0,2,4,6]},
'Minor 7':{intervals:[0,3,7,10],degrees:[0,2,4,6]},
'Half-diminished 7':{intervals:[0,3,6,10],degrees:[0,2,4,6]},
'Diminished 7':{intervals:[0,3,6,9],degrees:[0,2,4,6]},
'Suspended 4':{intervals:[0,5,7],degrees:[0,3,4]}
};
function setNotationMode(v){notationMode=v;inversion=0;render()}
function setQuality(v){chordQuality=v;inversion=0;render()}
function setInversion(v){inversion=Number(v);render()}
function setClef(v){clef=v;render()}
function signatureAccidentals(sig){
const letters=sig>0?['F','C','G','D','A','E','B']:['B','E','A','D','G','C','F'];
const map={};for(let i=0;i<Math.abs(sig);i++)map[letters[i]]=sig>0?'♯':'♭';return map;
}
function spellingFor(pitch,letter){
let delta=(pitch-naturalPitch[letter]+12)%12;
return {letter,accidental:delta===0?'':delta===1?'♯':delta===2?'𝄪':delta===11?'♭':delta===10?'𝄫':'?',pitch};
}
function notationData(){
const tonic=keyInfo[root].tonic,rootPitch=chromatic.indexOf(root);
const keySig=scale==='Minor'?keyInfo[chromatic[(rootPitch+3)%12]].sig:keyInfo[root].sig;
const spec=notationMode==='Chord'?qualities[chordQuality]:null;
const offsets=spec?spec.intervals:patterns[scale];
const degrees=spec?spec.degrees:scale==='Pentatonic'?[0,1,2,4,5]:[0,1,2,3,4,5,6];
const start=noteLetters.indexOf(tonic[0]);
let spelling=offsets.map((offset,i)=>spellingFor((rootPitch+offset)%12,noteLetters[(start+degrees[i])%7]));
const count=spelling.length;
if(notationMode==='Chord'){
const shift=inversion%count;
spelling=spelling.slice(shift).concat(spelling.slice(0,shift));
}
const signature=notationMode==='Chord'?keyInfo[root].sig:keySig;
const sigMap=signatureAccidentals(signature);
const noteData=spelling.map(n=>({...n,label:n.letter+n.accidental,explicit:n.accidental!== (sigMap[n.letter]||'')}));
return {spelling:noteData,signature,signatureMap:sigMap,tonic};
}
function staffSVG(){
const data=notationData(),sig=data.signature, bass=clef==='Bass';
const bottom=bass?{letter:'G',octave:2}:{letter:'E',octave:4};
const stepIndex=(letter,octave)=>(octave-bottom.octave)*7+noteLetters.indexOf(letter)-noteLetters.indexOf(bottom.letter);
const yAt=(letter,octave)=>116-stepIndex(letter,octave)*7;
const width=Math.max(610,190+Math.abs(sig)*21+(notationMode==='Scale'?data.spelling.length*53:180));
const sigOrder=sig>0?['F','C','G','D','A','E','B']:['B','E','A','D','G','C','F'];
const sharpOct=bass?[3,3,3,3,2,3,2]:[5,5,5,5,4,5,4];
const flatOct=bass?[2,3,2,3,2,3,2]:[4,5,4,5,4,5,4];
const sigSvg=sigOrder.slice(0,Math.abs(sig)).map((l,i)=>'<text x="'+(100+i*21)+'" y="'+(yAt(l,(sig>0?sharpOct:flatOct)[i])+8)+'" font-family="serif" font-size="27" fill="#1a222c">'+(sig>0?'♯':'♭')+'</text>').join('');
let octave=bass?2:4,prev=-1;
const baseX=140+Math.abs(sig)*21;
const displayNotes=notationMode==='Chord'?voicingNotes():data.spelling;
const noteSvg=displayNotes.map((n,i)=>{
const idx=noteLetters.indexOf(n.letter);
if(i===0){octave=bass?(notationMode==='Chord'?2:3):4;}
else if(idx<=prev)octave++;
prev=idx;
if(notationMode==='Chord')octave=n.octave;
const y=yAt(n.letter,octave),x=notationMode==='Chord'?baseX+25:baseX+i*53;
let ledger='';
for(let yy=130;yy<=y+1;yy+=14)ledger+='<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="'+yy+'" y2="'+yy+'" stroke="#1a222c"/>';
for(let yy=60;yy>=y-1;yy-=14)ledger+='<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="'+yy+'" y2="'+yy+'" stroke="#1a222c"/>';
const accidental=n.explicit?'<text x="'+(x-(notationMode==='Chord'?34:23))+'" y="'+(y+7)+'" font-family="serif" font-size="23" fill="#1a222c">'+(n.accidental||'♮')+'</text>':'';
return ledger+accidental+'<ellipse cx="'+x+'" cy="'+y+'" rx="9" ry="6" transform="rotate(-20 '+x+' '+y+')" fill="#455b75"/>'+(notationMode==='Scale'?'<line x1="'+(x+8)+'" y1="'+y+'" x2="'+(x+8)+'" y2="'+(y-34)+'" stroke="#455b75" stroke-width="1.5"/>':'')+(notationMode==='Scale'?'<text x="'+x+'" y="180" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="12" fill="#455b75">'+n.label+'</text>':'');
}).join('');
return '<div class="staff-wrap"><svg viewBox="0 0 '+width+' 195" role="img" aria-label="'+data.tonic+' '+(notationMode==='Chord'?chordQuality+' chord':' '+scale+' scale')+' on '+clef.toLowerCase()+' clef staff" style="width:100%;min-width:470px;max-width:900px">'+[60,74,88,102,116].map(y=>'<line x1="18" x2="'+(width-20)+'" y1="'+y+'" y2="'+y+'" stroke="#56616a" stroke-width="1.3"/>').join('')+'<text x="26" y="'+(bass?109:117)+'" font-family="serif" font-size="'+(bass?57:68)+'" fill="#1a222c">'+(bass?'𝄢':'𝄞')+'</text>'+sigSvg+noteSvg+'</svg></div><p class="muted"><strong>Key signature:</strong> '+(sig===0?'None':Math.abs(sig)+' '+(sig>0?'sharp':'flat')+(Math.abs(sig)===1?'':'s'))+' · <strong>Written notes:</strong> '+data.spelling.map(n=>n.label).join(' – ')+'</p>';
}

function circleSpelled(key){
const letters=['C','D','E','F','G','A','B'],begin=letters.indexOf(key.name[0]),map=signatureAccidentals(key.sig);
return Array.from({length:7},(_,i)=>{let l=letters[(begin+i)%7];return l+(map[l]||'')});
}

const cx=225,cy=225;
const sectors=circleKeys.map((k,i)=>{
const a=(i*30-90)*Math.PI/180,x=cx+174*Math.cos(a),y=cy+174*Math.sin(a),mx=cx+115*Math.cos(a),my=cy+115*Math.sin(a),active=k.name===circleSelected;

}).join('');

}
function voicingNotes(){
const d=notationData();let octave=pianoOctave,prev=-1;
let a=d.spelling.map(n=>{const idx=noteLetters.indexOf(n.letter);if(prev>=0&&idx<=prev)octave++;prev=idx;return {...n,octave};});
if(voicing==='Open'&&a.length>2)a[1].octave++;
if(voicing==='Spread'&&a.length>2){a[1].octave++;a[a.length-1].octave++}
return a.sort((x,y)=>(x.octave*7+noteLetters.indexOf(x.letter))-(y.octave*7+noteLetters.indexOf(y.letter)));
}

if(notationMode!=='Chord')return '';

}
