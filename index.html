<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b30"><title>Mélodie | My Music Learning Lab</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#23343a;background:#f7f7f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#18353b;color:#fff;padding:18px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:.5px}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{border:0;background:transparent;color:#dce6e4;padding:10px 12px;border-radius:9px}nav button.active,nav button:hover{background:#315158;color:#fff}main{max-width:1100px;margin:auto;padding:36px 24px 80px}.hero{background:#e9eee9;border-radius:22px;padding:40px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#577e77;font-weight:700}h1{font:normal clamp(35px,5vw,58px) Georgia,serif;margin:12px 0}h2{font:normal 32px Georgia,serif}h3{margin:0 0 10px}p{line-height:1.65;color:#5a696b}.hero-art{font-size:90px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}.card,.panel{background:#fff;border:1px solid #e1e6e3;border-radius:16px;padding:24px}.card{cursor:pointer;text-align:left;color:inherit}.card:hover{border-color:#66988e;box-shadow:0 8px 24px #18353b10}.card .emoji{font-size:30px}.muted{color:#617275}.pill{display:inline-block;background:#e4eee9;color:#356b60;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}select,input{padding:10px 12px;border:1px solid #ced8d2;border-radius:9px;background:white;max-width:100%}.primary{background:#27685f;color:#fff;border:0;border-radius:9px;padding:11px 16px}.keyboard{display:flex;position:relative;height:190px;max-width:720px;margin:24px 0}.white{flex:1;border:1px solid #777;border-radius:0 0 5px 5px;background:white;position:relative;display:flex;align-items:end;justify-content:center;padding-bottom:10px;font-size:12px}.white.on{background:#a6d6c7}.black{position:absolute;top:0;width:6.5%;height:60%;background:#263037;border-radius:0 0 5px 5px;z-index:2;transform:translateX(-50%)}.fret{overflow-x:auto}.fret table{border-collapse:collapse;width:100%;min-width:470px}.fret td{border-bottom:2px solid #89938f;border-right:2px solid #c3b7a5;text-align:center;height:38px;min-width:50px}.fret th{font-weight:500;color:#667}.note{display:inline-grid;place-items:center;background:#327d70;color:white;border-radius:50%;height:29px;width:29px;font-size:12px}.lesson{margin:12px 0}.lesson button{width:100%;text-align:left;background:#fff;border:1px solid #e1e6e3;padding:16px;border-radius:10px}.lesson button:hover{border-color:#327d70}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 14px;border-radius:9px;border:1px solid #cbd8d3;background:#fff}.tabs button.active{background:#27685f;color:white}.hidden{display:none}.progress{height:9px;background:#e2e9e5;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#3a8a78}footer{padding:25px;text-align:center;color:#82918c;font-size:13px}@media(max-width:640px){.hero{grid-template-columns:1fr;padding:26px}.hero-art{display:none}header{padding:16px 24px}main{padding:24px 16px}}

/* Shared visual language with Ducks In Order and Amelia's portfolio */
:root{font-family:Montserrat,system-ui,sans-serif;color:#1a222c;background:#f4f4f4}
body{background:#f4f4f4;color:#1a222c;font-family:Montserrat,sans-serif}
.site-hero{height:auto;min-height:310px;padding:45px 22px 34px;background:#1a222c;color:white;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;text-align:center}
.hero-particles{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(circle at 12% 27%,#6f88a5 1px,transparent 2px),radial-gradient(circle at 68% 18%,#6f88a5 1px,transparent 2px),radial-gradient(circle at 83% 65%,#6f88a5 1px,transparent 2px),radial-gradient(circle at 31% 77%,#6f88a5 1px,transparent 2px);background-size:240px 190px,310px 250px,270px 210px,360px 240px}
.site-hero-inner{position:relative;z-index:1;max-width:1100px;width:100%}
.site-eyebrow{font-size:.73rem;letter-spacing:.18em;color:#c6d7e7;font-weight:700}
.logo{font:600 clamp(2.2rem,5vw,3.5rem) Montserrat,sans-serif;letter-spacing:0;margin:10px 0}
.site-subtitle{color:#d8e0e9;margin:0 0 24px;font-size:.95rem}
nav{justify-content:center;gap:14px}
nav button{font-family:Montserrat,sans-serif;color:white;font-size:.82rem;font-weight:500;padding:9px 8px}
nav button.active,nav button:hover{background:transparent;color:#a9c0d7;text-decoration:underline;text-underline-offset:7px}
main{max-width:1050px;padding:35px 22px 80px}
.hero{background:transparent;padding:8px 0 15px;border-radius:0;grid-template-columns:1fr;display:block}
.hero .eyebrow{color:#455b75}
.hero h1,h1,h2{font-family:Montserrat,sans-serif;color:#1a222c;font-weight:600}
.hero h1{font-size:2rem;margin:10px 0}
.hero p,p{color:#5d6772}
.hero-art{display:none}
.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card,.panel{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:22px;box-shadow:0 3px 12px #1a222c08}
.card:hover{border-color:#9caec3;transform:translateY(-3px);box-shadow:0 5px 18px #1a222c12}
.pill{background:#e9eff5;color:#455b75}
.primary{background:#455b75;border-radius:8px}
.primary:hover{background:#354a62}
.progress{background:#e7ebef}.progress div{background:#455b75}
.tabs button.active{background:#455b75}
.note{background:#455b75}
.white.on{background:#cfdfed}
.lesson button{border:1px solid #e1e6ec}
.lesson button:hover{border-color:#455b75}
footer{background:#1a222c;color:white;padding:30px}
@media(max-width:640px){.site-hero{min-height:285px;padding:35px 16px 26px}nav{gap:7px}.hero{padding:4px 0 12px}main{padding:25px 16px 60px}}
.staff-wrap{overflow-x:auto;padding:14px 0;background:#fff;border-radius:10px}.staff-wrap svg{display:block}</style></head><body><header class="site-hero"><div class="hero-particles" aria-hidden="true"></div><div class="site-hero-inner"><div class="site-eyebrow">MY MUSIC LEARNING LAB</div><div class="logo">Mélodie</div><p class="site-subtitle">Music theory · Piano · Guitar · Cello</p><nav id="nav"></nav></div></header><main id="app"></main><footer>Made for the joy of learning music · Mélodie</footer>
<script>
const pages=['Home','Learn','Instruments','Scales & Chords','Sheet Music','Practice'];
let page='Home', instrument='Piano', root='C', scale='Major', libraryFilter='All';
const chromatic=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const patterns={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Pentatonic:[0,2,4,7,9]};
const lessons=[['Music Fundamentals','Notes, octaves, sharps, flats, and intervals'],['Rhythm & Notation','Note values, rests, measures, and reading music'],['Scales','Major, minor, and pentatonic patterns'],['Chords','Triads, seventh chords, and inversions'],['Harmony','Chord progressions and the circle of fifths'],['Applied Theory','Transposition, ear training, and improvisation']];
const songs=[{title:'Your first song',artist:'Example entry',instrument:'Guitar',format:'Tab / PDF',status:'To learn'}];
const $=s=>document.querySelector(s);
const notes=()=>patterns[scale].map(n=>chromatic[(chromatic.indexOf(root)+n)%12]);
const buttons=(values,current,fn)=>'<div class="tabs">'+values.map(v=>'<button class="'+(v===current?'active':'')+'" onclick="'+fn+'('+JSON.stringify(v).replace(/"/g,'&quot;')+')">'+v+'</button>').join('')+'</div>';
function setPage(p){page=p;render();window.scrollTo(0,0)}
function setInstrument(v){instrument=v;render()}
function setRoot(v){root=v;render()}
function setScale(v){scale=v;render()}
function setFilter(v){libraryFilter=v;render()}
function completion(){return JSON.parse(localStorage.getItem('melodie-lessons')||'[]')}
function toggleLesson(i){let x=completion();x=x.includes(i)?x.filter(n=>n!==i):[...x,i];localStorage.setItem('melodie-lessons',JSON.stringify(x));render()}
function piano(){let white=['C','D','E','F','G','A','B','C','D','E','F','G','A','B'];let blackAfter=[0,1,3,4,5,7,8,10,11,12];return '<div class="keyboard">'+white.map(n=>'<div class="white '+(notes().includes(n)?'on':'')+'">'+n+'</div>').join('')+blackAfter.map(i=>'<div class="black" style="left:'+((i+1)/14*100)+'%"></div>').join('')+'</div>'}
function guitar(){let tuning=['E','B','G','D','A','E'];return '<div class="fret"><table><tr><th>String</th>'+Array.from({length:13},(_,f)=>'<th>'+f+'</th>').join('')+'</tr>'+tuning.map(n=>'<tr><th>'+n+'</th>'+Array.from({length:13},(_,f)=>{let pitch=chromatic[(chromatic.indexOf(n)+f)%12];return '<td>'+(notes().includes(pitch)?'<span class="note">'+pitch+'</span>':'')+'</td>'}).join('')+'</tr>').join('')+'</table></div><p class="muted">Standard tuning (E A D G B E). Highlighted notes belong to the selected scale.</p>'}

let notationMode='Scale';
const keyInfo={
'C':{tonic:'C',sig:0},'C♯':{tonic:'D♭',sig:-5},'D':{tonic:'D',sig:2},'D♯':{tonic:'E♭',sig:-3},'E':{tonic:'E',sig:4},'F':{tonic:'F',sig:-1},'F♯':{tonic:'F♯',sig:6},'G':{tonic:'G',sig:1},'G♯':{tonic:'A♭',sig:-4},'A':{tonic:'A',sig:3},'A♯':{tonic:'B♭',sig:-2},'B':{tonic:'B',sig:5}};
const noteLetters=['C','D','E','F','G','A','B'];
const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function notationData(){
const offsets=notationMode==='Chord'?(scale==='Minor'?[0,3,7]:[0,4,7]):patterns[scale];
const rootIndex=chromatic.indexOf(root), tonic=keyInfo[root].tonic;
const letterStart=noteLetters.indexOf(tonic[0]);
const degreeSteps=notationMode==='Chord'?[0,2,4]:scale==='Pentatonic'?[0,1,2,4,5]:[0,1,2,3,4,5,6];
const spelling=offsets.map((offset,i)=>{const letter=noteLetters[(letterStart+degreeSteps[i])%7];const pitch=(rootIndex+offset)%12;let delta=(pitch-naturalPitch[letter]+12)%12;const accidental=delta===11?'♭':delta===1?'♯':delta===2?'𝄪':delta===10?'𝄫':'';return {letter,accidental,label:letter+accidental}});
const majorSignature=keyInfo[root].sig;
const minorSig=keyInfo[chromatic[(rootIndex+3)%12]].sig;
return {spelling,signature:scale==='Minor'?minorSig:majorSignature};
}
function setNotationMode(v){notationMode=v;render()}
function staffSVG(){
const data=notationData(),sig=data.signature;
const sharpPositions=[70,85,65,80,95,75,90],flatPositions=[90,75,95,80,100,85,105];
const sigCount=Math.abs(sig), startX=105, noteX=145+sigCount*18;
const lineY=[70,80,90,100,110], stepY=5;
const staffIndex={E:0,F:1,G:2,A:3,B:4,C:5,D:6};
const noteY=(letter,octave)=>110-(staffIndex[letter]+(octave-4)*7)*stepY;
const signSvg=Array.from({length:sigCount},(_,i)=>'<text x="'+(startX+i*18)+'" y="'+(sig>0?sharpPositions[i]:flatPositions[i])+'" font-family="serif" font-size="25" fill="#1a222c">'+(sig>0?'♯':'♭')+'</text>').join('');
const notesSvg=data.spelling.map((n,i)=>{let octave=notationMode==='Chord'?4:4;if(notationMode==='Scale'&&i>0){let first=data.spelling[0].letter;octave=4+(noteLetters.indexOf(n.letter)<noteLetters.indexOf(first)?1:0)}if(notationMode==='Chord'){octave=4;}const y=noteY(n.letter,octave),x=notationMode==='Chord'?noteX+20:noteX+i*49;const extra=y>110?Array.from({length:Math.floor((y-110)/10)},(_,k)=>'<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="'+(120+k*10)+'" y2="'+(120+k*10)+'" stroke="#1a222c"/>').join(''):'';return extra+'<ellipse cx="'+x+'" cy="'+y+'" rx="8" ry="5.7" transform="rotate(-20 '+x+' '+y+')" fill="#455b75"/>'+(notationMode==='Chord'?'':'<line x1="'+(x+7)+'" y1="'+y+'" x2="'+(x+7)+'" y2="'+(y-31)+'" stroke="#455b75" stroke-width="1.7"/>')+'<text x="'+x+'" y="155" font-family="Montserrat,sans-serif" font-size="11" text-anchor="middle" fill="#455b75">'+(notationMode==='Chord'?'':n.label)+'</text>'}).join('');
const width=Math.max(520,noteX+(notationMode==='Chord'?90:data.spelling.length*49+30));
return '<div class="staff-wrap"><svg viewBox="0 0 '+width+' 175" role="img" aria-label="'+root+' '+scale+' '+notationMode.toLowerCase()+' on treble clef staff" style="width:100%;min-width:450px;max-width:850px">'+lineY.map(y=>'<line x1="18" y1="'+y+'" x2="'+(width-20)+'" y2="'+y+'" stroke="#56616a" stroke-width="1.2"/>').join('')+'<text x="25" y="115" font-family="serif" font-size="65" fill="#1a222c">𝄞</text>'+signSvg+notesSvg+'</svg></div><p class="muted"><strong>Key signature:</strong> '+(sig===0?'No sharps or flats':Math.abs(sig)+' '+(sig>0?'sharp':'flat')+(Math.abs(sig)===1?'':'s'))+' · <strong>Written notes:</strong> '+data.spelling.map(n=>n.label).join(' – ')+'</p>';
}
function explorer(){return '<h1>Scales & Chords</h1><p>Explore the same notes on different instruments. Chord-specific fingerings and inversions are planned for the next release.</p><div class="panel"><div class="toolbar"><label>Root note <select onchange="setRoot(this.value)">'+chromatic.map(n=>'<option '+(n===root?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Scale <select onchange="setScale(this.value)">'+Object.keys(patterns).map(n=>'<option '+(n===scale?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><p><strong>Notes:</strong> '+notes().join(' · ')+'</p><h3>Staff notation</h3>'+buttons(['Scale','Chord'],notationMode,'setNotationMode')+staffSVG()+'<h3>Instrument view</h3>'+buttons(['Piano','Guitar','Cello'],instrument,'setInstrument')+(instrument==='Piano'?piano():instrument==='Guitar'?guitar():'<p>Cello fingerboard mapping is coming soon. Cello strings are tuned C–G–D–A.</p>')+'</div>'}
function render(){ $('#nav').innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" onclick="setPage('+JSON.stringify(p).replace(/"/g,'&quot;')+')">'+p+'</button>').join('');let done=completion().length;
let content='';
if(page==='Home')content='<section class="hero"><div><div class="eyebrow">Your personal music learning space</div><h1>Music makes sense here.</h1><p>Learn the theory once. Discover how it connects across piano, guitar, and cello. Build your own library along the way.</p><button class="primary" onclick="setPage(\'Learn\')">Start learning →</button></div><div class="hero-art">♫</div></section><div class="cards">'+[['📖','Music Theory','A structured curriculum','Learn'],['🎹','Scales & Chords','Explore notes across instruments','Scales & Chords'],['🎼','Sheet Music','Your personal collection','Sheet Music'],['✓','Practice','Build confidence through repetition','Practice']].map(c=>'<button class="card" onclick="setPage(\''+c[3]+'\')"><div class="emoji">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></button>').join('')+'</div><div class="panel" style="margin-top:24px"><h3>Learning progress</h3><p>'+done+' of '+lessons.length+' foundational modules marked complete</p><div class="progress"><div style="width:'+(done/lessons.length*100)+'%"></div></div></div>';
if(page==='Learn')content='<h1>Learn Music Theory</h1><p>Follow the concepts in order. Each module will grow into explanations, examples, guided breakdowns, and exercises.</p>'+lessons.map((l,i)=>'<div class="lesson"><button onclick="toggleLesson('+i+')"><span class="pill">Module '+(i+1)+'</span> <strong>'+l[0]+'</strong> — '+l[1]+' <span style="float:right">'+(completion().includes(i)?'✓ Complete':'○ Mark complete')+'</span></button></div>').join('');
if(page==='Instruments')content='<h1>Instruments</h1><p>Learn technique separately while connecting everything back to shared music theory.</p><div class="cards">'+[['🎹','Piano','Keyboard geography, hand coordination, and notation'],['🎸','Guitar','Fretboard notes, chord shapes, strumming, and tabs'],['🎻','Cello','Fingerboard positions, bowing, and reading bass clef (coming later)']].map(c=>'<div class="card"><div class="emoji">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div>').join('')+'</div>';
if(page==='Scales & Chords')content=explorer();
if(page==='Sheet Music')content='<h1>Sheet Music Library</h1><p>A place for PDFs, tabs, and scores. This starter library shows example metadata; adding and saving your own files will come in a later release.</p>'+buttons(['All','Piano','Guitar','Cello'],libraryFilter,'setFilter')+'<div class="cards">'+songs.filter(s=>libraryFilter==='All'||s.instrument===libraryFilter).map(s=>'<div class="card"><span class="pill">'+s.instrument+'</span><h3>'+s.title+'</h3><p>'+s.artist+' · '+s.format+' · '+s.status+'</p></div>').join('')+'</div>';
if(page==='Practice')content='<h1>Practice Lab</h1><p>Start with note recognition and scale construction. More interactive quizzes are on the roadmap.</p><div class="panel"><h3>Quick practice</h3><p>What are the notes of the C major scale?</p><button class="primary" onclick="document.getElementById(\'answer\').classList.toggle(\'hidden\')">Reveal answer</button><p id="answer" class="hidden"><strong>C · D · E · F · G · A · B</strong></p></div>';
$('#app').innerHTML=content}
render();
</script></body></html>
